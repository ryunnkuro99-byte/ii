<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Luke Bypass — App Launcher</title>
  <meta name="description" content="Luke Bypass — a fast, minimal Android-style app launcher for quick access to settings, tools, and apps." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">Luke <span>Bypass</span></h1>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="search" type="text" placeholder="Search apps…" autocomplete="off" />
      </div>
    </div>
  </header>

  <main id="app-container" class="container">
    <!-- Sections injected by script.js -->
  </main>

  <p class="empty" id="empty-state" hidden>No apps match your search.</p>

  <footer class="footer">
    <span>Luke Bypass · Tap an icon to launch</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
