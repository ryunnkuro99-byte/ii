  <script>
    (function(){
      const btn = document.getElementById("theme-toggle");
      const meta = document.getElementById("theme-color-meta");
      const saved = localStorage.getItem("lb-theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
      if (meta) meta.setAttribute("content", saved === "light" ? "#f7f8fa" : "#0a0a0c");
      btn.addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = cur === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("lb-theme", next);
        if (meta) meta.setAttribute("content", next === "light" ? "#f7f8fa" : "#0a0a0c");
      });
      // Visitor tracking → Telegram (once per session per page)
      try {
        const key = "lb-tracked-" + location.pathname;
        if (!sessionStorage.getItem(key)) {
          sessionStorage.setItem(key, "1");
          fetch("/api/track", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ page: location.pathname, ref: document.referrer || "direct" }),
            keepalive: true,
          }).catch(()=>{});
        }
      } catch(e) {}
    })();
  </script>
